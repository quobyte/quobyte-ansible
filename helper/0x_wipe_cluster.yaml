- hosts: clients 
  become: yes
  ignore_errors: yes
  tasks:

    - set_fact: 
        package_url: https://packages.quobyte.com/repo/v3 

    - set_fact: 
        rpm_distribution_string: RHEL 
      when: ansible_facts['os_family'] == "RedHat"

    - name: stop Quobyte clients  
      ignore_errors: yes
      service:
        state: stopped
        enabled: false 
        name: "{{ item }}"
      with_items:
        - quobyte-client

    - name: remove RPM packages
      yum: 
        update_cache: no 
        state: absent
        name: "{{ packages }}"
      vars:
        packages:
        - quobyte-client 
        - quobyte-tools
        - quobyte-thirdparty-libraries
      when: ansible_facts['os_family'] == "RedHat"

    - name: Remove Quobyte rpm repository to sources list
      yum_repository:
        name: quobyte
        description: Quobyte rpm repo
        baseurl: "{{ package_url }}/rpm/{{ rpm_distribution_string }}_{{ ansible_facts['distribution_major_version'] }}"
        state: absent
      when: ansible_facts['os_family'] == "RedHat"

    - name: Clear rpm package cache
      command:
        cmd: dnf clean all
      when: ansible_facts['os_family'] == "RedHat"

    - name: solve dependency conflicts for half installe packages
      command:
        cmd: dpkg --configure -a
      when: ansible_facts['os_family'] == "Debian"

    - name: remove Debian packages
      apt:
        name: "{{ packages }}"
        state: absent 
        purge: yes
      vars:
        packages:
        - quobyte-thirdparty-libraries
        - quobyte-tools
        - quobyte-client
      when: ansible_facts['os_family'] == "Debian"

    - name: Remove Quobyte apt repository to sources list
      apt_repository:
        repo: "deb {{ package_url }}/apt {{ ansible_facts['distribution_release'] }} main"
        state: absent 
      when: ansible_facts['os_family'] == "Debian"

    - name: Remove Quobyte directories
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /var/lib/quobyte
        - /etc/quobyte 
        - /quobyte 

    - name: Remove Quobyte apt repository from sources list
      apt_repository:
        repo: "deb {{ package_url }}/apt {{ ansible_facts['distribution_release'] }} main"
        state: absent 
      when: ansible_facts['os_family'] == "Debian"

- hosts: quobyteservers
  become: yes
  ignore_errors: yes
  tasks:

    - set_fact: 
        package_url: https://packages.quobyte.com/repo/v3 

    - set_fact: 
        rpm_distribution_string: RHEL 
      when: ansible_facts['os_family'] == "RedHat"

    - name: Build list of running quobyte-* services
      ansible.builtin.set_fact:
        quobyte_running_services: >-
          {{
            ansible_facts['services']
            | dict2items
            | selectattr('key', 'match', '^quobyte-.*\.service$')
            | selectattr('value.state', 'equalto', 'running')
            | map(attribute='key')
            | list
          }}

    - name: Stop running Quobyte services 
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop: "{{ quobyte_running_services }}"

    - name: build device list
      shell:
        cmd: mount | grep /var/lib/quobyte | awk '{print $1}'
      register: quobyte_devices 

    - set_fact: 
       devices_to_wipe: "{{ quobyte_devices.stdout_lines }}"

    - name: umount devices
      command: 
        cmd: umount {{ item }}
      with_items:
        - "{{ devices_to_wipe }}"

    - name: wipe devices
      command: 
        cmd: wipefs -a {{ item }}
      with_items:
        - "{{ devices_to_wipe }}"

    - name: update device labels
      command: 
        cmd: partprobe {{ item }}
      with_items:
        - "{{ devices_to_wipe }}"

    - name: remove RPM packages
      yum: 
        update_cache: no 
        state: absent
        name: "{{ packages }}"
      vars:
        packages:
        - quobyte-server
        - quobyte-tools
        - quobyte-client 
        - quobyte-thirdparty-libraries
      when: ansible_facts['os_family'] == "RedHat"

    - name: Remove Quobyte rpm repository to sources list
      yum_repository:
        name: quobyte
        description: Quobyte rpm repo
        baseurl: "{{ package_url }}/rpm/{{ rpm_distribution_string }}_{{ ansible_facts['distribution_major_version'] }}"
        state: absent
      when: ansible_facts['os_family'] == "RedHat"

    - name: Clear rpm package cache
      command:
        cmd: dnf clean all
      when: ansible_facts['os_family'] == "RedHat"

    - name: solve dependency conflicts for half installe packages
      command:
        cmd: dpkg --configure -a
      when: ansible_facts['os_family'] == "Debian"

    - name: remove Debian packages
      apt:
        name: "{{ packages }}"
        state: absent 
        purge: yes
      vars:
        packages:
        - quobyte-thirdparty-libraries
        - quobyte-server
        - quobyte-tools
        - quobyte-client
      when: ansible_facts['os_family'] == "Debian"

    - name: Remove Quobyte apt repository to sources list
      file:
        path: /etc/apt/sources.list.d/quobyte.sources 
        state: absent
      when: ansible_facts['os_family'] == "Debian"

    - name: Remove Quobyte directories
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /var/lib/quobyte
        - /etc/quobyte 
        - /quobyte 

    - name: Remove Quobyte apt repository from sources list
      apt_repository:
        repo: "deb {{ package_url }}/apt {{ ansible_facts['distribution_release'] }} main"
        state: absent 
      when: ansible_facts['os_family'] == "Debian"

